<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="플래너">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>플래너</title>
<script>
const THC={blue:['블루','#3182f6','#4c94ff'],green:['그린','#1f9d55','#3dbb73'],mint:['민트','#0fa39a','#2fc4b8'],purple:['퍼플','#7c4ddb','#a07cf0'],pink:['핑크','#e5487f','#f06f9b'],orange:['오렌지','#ef6c00','#ff9142'],mono:['모노','#111111','#f2f2f2']};
function applyTheme(){let t={};try{t=JSON.parse(localStorage.getItem('planner.theme'))||{}}catch(e){}
  const r=document.documentElement,m=t.mode||'system',c=THC[t.color]?t.color:'blue';
  if(m=='system')delete r.dataset.theme;else r.dataset.theme=m;
  const dark=m=='dark'||(m=='system'&&matchMedia('(prefers-color-scheme: dark)').matches);
  r.style.setProperty('--pr',THC[c][dark?2:1]);r.style.setProperty('--on',c=='mono'&&dark?'#111':'#fff');
  const mt=document.querySelector('meta[name=theme-color]');if(mt)mt.content=dark?'#0d0d0d':'#fafafa';return{m,c}}
applyTheme();try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme)}catch(e){}
</script>
<style>
:root{--bg:#fafafa;--sf:#fff;--tx:#111;--mu:#777;--ln:#e6e6e6;--sh:#f0f0f0;--ac:#111;--at:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d0d;--sf:#171717;--tx:#f2f2f2;--mu:#8a8a8a;--ln:#2a2a2a;--sh:#222;--ac:#f2f2f2;--at:#111;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0d0d;--sf:#171717;--tx:#f2f2f2;--mu:#8a8a8a;--ln:#2a2a2a;--sh:#222;--ac:#f2f2f2;--at:#111;color-scheme:dark}
:root{--pr:#3182f6;--on:#fff;--dn:#e5484d;--prs:#eaf2fe;--prs:color-mix(in srgb,var(--pr) 13%,var(--bg))}
.seg{display:flex;background:var(--sh);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;padding:8px 6px;border-radius:8px;color:var(--mu);font-size:14px}
.seg .on{background:var(--sf);color:var(--tx);font-weight:650;box-shadow:0 0 0 1px var(--ln)}
.sws{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.swc{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--mu);width:52px}
.swc i{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:18px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.swc.on{color:var(--tx);font-weight:650}
.swc.on i{box-shadow:0 0 0 2px var(--bg),0 0 0 4px currentColor}
.tpv{display:flex;align-items:center;gap:10px;margin-top:14px;padding:12px 14px;border:1px solid var(--ln);border-radius:12px;background:var(--sf)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
[hidden]{display:none!important}
.app{max-width:620px;margin:0 auto;padding:14px 16px calc(150px + env(safe-area-inset-bottom,0px))}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.top b{font-size:17px;letter-spacing:-.01em}
.tabs{display:flex;background:var(--sh);border-radius:10px;padding:3px}
.tabs button{padding:6px 11px;border-radius:8px;color:var(--mu);font-size:14px}
.tabs .on{background:var(--sf);color:var(--tx);box-shadow:0 0 0 1px var(--ln)}
.dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.dt{text-align:center}
.dt h1{font-size:22px;font-weight:650;letter-spacing:-.02em}
.dt p{color:var(--mu);font-size:14px}
.bg{margin-left:8px;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--pr);color:var(--on)}
.ib{width:40px;height:40px;border-radius:10px;font-size:22px;color:var(--mu);display:inline-flex;align-items:center;justify-content:center;flex:none}
.ib:hover{background:var(--sh)}
.ib.sm{width:32px;height:32px;font-size:15px}
.acts{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.acts.end{justify-content:flex-end;margin:14px 0 0}
.btn{border:1px solid var(--ln);background:var(--sf);border-radius:10px;padding:8px 14px;font-size:14px}
.btn:hover{border-color:var(--mu)}
.btn.pri{background:var(--pr);color:var(--on);border-color:var(--pr)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.pgs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:26px}
.pg{border:1px solid var(--ln);background:var(--sf);border-radius:12px;padding:12px 14px}
.pl{display:flex;justify-content:space-between;font-size:14px;color:var(--mu)}
.pl b{color:var(--tx);font-size:18px}
.bar{height:4px;background:var(--sh);border-radius:4px;margin:8px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pr)}
.pg small{color:var(--mu);font-size:12px}
section{margin-bottom:30px}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:8px}
h2{font-size:16px;font-weight:650}
ul{list-style:none;padding:0}
.row{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--ln);width:100%;text-align:left;min-height:56px}
.ic{width:44px;height:44px;font-size:23px;border-radius:12px;flex:none}
.ic:hover{background:var(--sh)}
.tx{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;text-align:left;word-break:break-word;align-self:stretch;justify-content:center}
.tx small{color:var(--mu);font-size:13px;font-variant-numeric:tabular-nums}
.done .tx{color:var(--mu);text-decoration:line-through}
.em{color:var(--mu);padding:14px 0;font-size:14px}
.add{display:flex;gap:8px;margin-top:10px}
.add input,.fr input{flex:1;min-width:0;border:1px solid var(--ln);background:var(--sf);border-radius:10px;padding:9px 12px;outline:0}
.add input:focus,.fr input:focus{border-color:var(--mu)}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wd{color:var(--mu);font-size:13px;padding:6px 0}
.cd{aspect-ratio:1;border-radius:12px;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:1px solid transparent}
.cd:hover{background:var(--sh)}
.cd.o{color:var(--mu);opacity:.5}
.cd.td{background:var(--pr);color:var(--on)}
.cd.sel{border-color:var(--mu)}
.cd i{width:4px;height:4px;border-radius:50%;background:currentColor;visibility:hidden}
.cd i.dot{visibility:visible}
.hint{color:var(--mu);font-size:13px;margin:12px 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--sf);width:100%;max-width:460px;border-radius:18px 18px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:94%;overflow:auto;border:1px solid var(--ln)}
@media (min-width:640px){.ov{align-items:center}.sheet{border-radius:18px}}
.sht{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sht h3{font-size:17px}
.fr{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.ic.big{border:1px solid var(--ln);width:44px;height:44px}
.eg{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;margin-bottom:8px}
.eg button{font-size:22px;height:40px;border-radius:8px}
.eg button:hover{background:var(--sh)}
.chs{display:flex;gap:8px;margin:10px 0 0}
.chip{flex:1;border:1px solid var(--ln);border-radius:10px;padding:6px 10px;text-align:left;font-variant-numeric:tabular-nums}
.chip small{display:block;color:var(--mu);font-size:12px}
.chip.on{border-color:var(--pr);box-shadow:0 0 0 1px var(--pr)}
.whs{display:flex;position:relative;height:200px;margin:10px 0}
.whs::before{content:"";position:absolute;left:0;right:0;top:80px;height:40px;background:var(--sh);border-radius:10px}
.wh{flex:1;position:relative;height:200px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;text-align:center;touch-action:pan-y;overscroll-behavior:contain;cursor:grab;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);user-select:none}
.wh::-webkit-scrollbar{display:none}
.pad{height:80px}
.it{height:40px;line-height:40px;scroll-snap-align:center;font-size:20px;color:var(--mu);font-variant-numeric:tabular-nums}
.it.on{color:var(--tx);font-weight:650}
.er{color:var(--tx);font-size:13px;min-height:20px;margin-top:6px;font-weight:600}
.cl .row{padding:12px 4px;justify-content:space-between}
.cl .row:hover{background:var(--sh)}
.ts{position:fixed;left:50%;bottom:calc(146px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:30;width:max-content;max-width:calc(100% - 32px);display:flex;align-items:center;gap:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tsi .25s ease-out}
.ts button{color:#7fb2ff;font-weight:700;padding:4px 2px;margin-left:auto;white-space:nowrap}
@keyframes tsi{from{transform:translate(-50%,16px);opacity:0}}
.st{color:var(--mu);font-size:12px;min-width:52px}
.dg{width:28px;height:36px;color:var(--mu);cursor:grab;touch-action:none;flex:none}
.ri-row{flex-wrap:nowrap}
.ri-row input,.ri-row select{border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:8px;padding:6px 8px;outline:0;min-width:0;font:inherit}
.ri-row input[data-f=n]{flex:1}
.nm{width:58px}
.ri-row .ic{width:34px;height:34px;font-size:20px}
label.al{display:flex;align-items:center;gap:8px;margin:6px 0 2px;font-size:14px}label.al input{width:18px;height:18px}label.al select{margin-left:auto;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:8px;padding:5px 8px;font:inherit}
/* 하단 탭바 */
.tb{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:15}
.tb>div{display:flex;width:100%;max-width:620px}
.tb button{flex:1;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--mu)}
.tb svg{width:24px;height:24px}
.tb .on{color:var(--pr);font-weight:650}
/* FAB */
.fab{position:fixed;right:max(18px,calc(50% - 292px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--pr);color:var(--on);font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.22);z-index:16;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.fab:active{transform:scale(.92)}
/* 진행 링 */
.hero{display:flex;align-items:center;gap:16px;border:1px solid var(--ln);background:var(--sf);border-radius:16px;padding:14px 16px;margin-bottom:26px}
.hero.done{background:var(--prs);border-color:transparent}
.ring{width:68px;height:68px;flex:none;position:relative}
.ring svg{width:68px;height:68px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .rb{stroke:var(--sh)}
.ring .rf{stroke:var(--pr);stroke-linecap:round;animation:rg .6s ease-out}
@keyframes rg{from{stroke-dashoffset:var(--c)}}
.ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.hero b{display:block;font-size:16px}
.hero small{display:block;color:var(--mu);font-size:13px}
.stk{display:inline-block;margin-top:6px;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--prs);color:var(--pr);font-weight:650}
.hero.done .stk{background:var(--sf)}
/* 스와이프 행 */
.sw{position:relative;overflow:hidden;border-bottom:1px solid var(--ln)}
.sw .del{position:absolute;inset:0;background:var(--dn);color:#fff;display:flex;align-items:center;justify-content:flex-end;padding-right:22px;font-weight:650;font-size:14px}
.sw .row{background:var(--bg);border-bottom:0;position:relative;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .22s ease-out}
.fvm{font-size:13px;padding-right:8px}
.pop .ic{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.5)}100%{transform:scale(1)}}
.pop .tx span{animation:fdo .3s ease-out}
@keyframes fdo{from{color:var(--tx)}}
/* 빈 화면 */
.es{display:flex;flex-direction:column;align-items:center;text-align:center;padding:22px 12px;gap:3px;border-bottom:1px solid var(--ln)}
.esi{width:52px;height:52px;border-radius:50%;background:var(--prs);display:flex;align-items:center;justify-content:center;font-size:25px;margin-bottom:6px}
.es small{color:var(--mu);font-size:13px;margin-bottom:12px}
/* 코치마크 */
.tip{position:relative;background:var(--pr);color:var(--on);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;align-items:center;gap:8px;margin:4px 0 10px}
.tip::after{content:"";position:absolute;left:28px;bottom:-6px;border:6px solid transparent;border-top-color:var(--pr);border-bottom:0}
.tip button{margin-left:auto;background:rgba(255,255,255,.22);border-radius:8px;padding:5px 10px;white-space:nowrap}
#day{touch-action:pan-y}
.cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
/* 시트 애니메이션 */
.ov{animation:fd .2s ease-out}
.sheet{animation:su .3s cubic-bezier(.2,.8,.2,1)}
@keyframes fd{from{opacity:0}}
@keyframes su{from{transform:translateY(48px);opacity:.5}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
textarea{width:100%;min-height:96px;resize:vertical;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:10px;padding:10px 12px;font:inherit;outline:0}
@media (max-width:420px){.pgs{gap:8px}.dt h1{font-size:19px}.eg{grid-template-columns:repeat(7,1fr)}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><b>플래너</b></div>
  <main id="day"></main>
  <main id="cal" hidden></main>
</div>
<div class="ov" id="ov" hidden><div class="sheet" id="bd"></div></div>
<button class="fab" id="fab" data-a="fab" aria-label="추가" hidden>＋</button>
<nav class="tb" aria-label="메뉴"><div id="tabs"></div></nav>
<div class="ts" id="ts" role="status" hidden></div>
<script>
const K='planner.v1',H=40,DAYS='일월화수목금토',$=s=>document.querySelector(s);
const EM='📚 💻 ✍️ 📖 🧹 🍳 🍽️ ☕ 🛒 🚿 🪥 💊 🏃 🏋️ 🚴 🧘 🛏️ 😴 📞 ✉️ 💼 📝 🎧 🎮 🎬 🎵 🧺 🐶 🌿 🚗 🚌 🛍️ 💰 🎯 💡 🔧 🏠 🎂 ✈️ 🩺 🍎 🥗 💧 🎨 📷 🧠 ❤️ ⭐ 🔥'.split(' ');
const MK='planner.meta.v1';
let db={};try{db=JSON.parse(localStorage.getItem(K))||{}}catch(e){try{localStorage.setItem('planner.corrupt',localStorage.getItem(K))}catch(x){}}
try{if(!localStorage.getItem('planner.bak0')&&localStorage.getItem(K))localStorage.setItem('planner.bak0',localStorage.getItem(K))}catch(e){}
let meta={fav:[],rt:[],memo:{},U:[],R:[]};
try{const m=JSON.parse(localStorage.getItem(MK));if(m&&typeof m=='object')meta={...meta,...m}}catch(e){}
['fav','rt','U','R'].forEach(k=>{if(!Array.isArray(meta[k]))meta[k]=[]});if(!meta.memo||typeof meta.memo!='object')meta.memo={};
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tf=m=>{const h=Math.floor(m/60);return(h<12?'AM':'PM')+' '+((h%12)||12)+':'+pad(m%60)};
const ico=i=>i.d?'✅':(i.e||'☑️');
const get=k=>db[k]||{t:[],p:[]};
const mut=k=>{snap(k);return db[k]||(db[k]={t:[],p:[]})};
let cur=key(new Date()),view='day',cal={y:0,m:0},M=null,tt;
function stat(t){const e=$('#st');if(e)e.textContent=t}
function save(){for(const k in db)if(!db[k].t.length&&!db[k].p.length)delete db[k];try{localStorage.setItem(K,JSON.stringify(db));localStorage.setItem(MK,JSON.stringify(meta))}catch(e){toast('저장하지 못했어요. 아이폰 저장 공간을 확인하세요.')}}
let TA=null,jd=null,sup=0,G=null;
function toast(m,act){const t=$('#ts');t.hidden=true;t.innerHTML=`<span>${esc(m)}</span>${act?`<button id="tsa">${esc(act.l)}</button>`:''}`;TA=act?act.f:null;void t.offsetWidth;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{t.hidden=true;TA=null},act?4500:2600)}
function pr(a){const c=a.filter(i=>i.d).length;return{c,n:a.length,p:a.length?Math.round(c/a.length*100):0}}
const bar=(l,a)=>{const r=pr(a);return`<div class="pg"><div class="pl"><span>${l}</span><b>${r.p}%</b></div><div class="bar"><i style="width:${r.p}%"></i></div><small>${r.c}/${r.n} 완료</small></div>`};
const isFav=i=>meta.fav.some(f=>f.n==i.n&&(f.e||'')==(i.e||''));
const row=(k,i,sub)=>`<li class="sw"><div class="del" aria-hidden="true">삭제</div><div class="row${i.d?' done':''}${i.id==jd?' pop':''}" data-k="${k}" data-id="${i.id}"><button class="ic" data-a="tg" data-k="${k}" data-id="${i.id}" aria-label="완료 전환">${ico(i)}</button><button class="tx" data-a="ed" data-k="${k}" data-id="${i.id}"><span>${esc(i.n)}</span>${sub?`<small>${sub}</small>`:''}</button>${k=='p'&&isFav(i)?'<span class="fvm" aria-label="즐겨찾기">⭐</span>':''}</div></li>`;
const SV=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const TABS=[['day','일정',SV('<path d="M10 6h10M10 12h10M10 18h10"/><path d="M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5 2.5-2.5M3.5 18l1.5 1.5 2.5-2.5"/>')],['week','주간',SV('<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 13v4M12 13v4M16 13v4"/>')],['cal','캘린더',SV('<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2.5v3M16 2.5v3"/><circle cx="12" cy="15" r="1.3" fill="currentColor"/>')],['more','관리',SV('<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>')]];
function dayOk(k){const x=db[k];if(!x)return false;const a=[...x.t,...x.p];return a.length>0&&a.every(i=>i.d)}
function streak(){const d=new Date();if(!dayOk(key(d)))d.setDate(d.getDate()-1);let n=0;while(dayOk(key(d))&&n<3660){n++;d.setDate(d.getDate()-1)}return n}
function hero(x){

const ALO=[[0,'정시'],[5,'5분 전'],[10,'10분 전'],[15,'15분 전'],[30,'30분 전'],[60,'1시간 전']];
