<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="플래너">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>플래너</title>
<style>
:root{--bg:#fafafa;--sf:#fff;--tx:#111;--mu:#777;--ln:#e6e6e6;--sh:#f0f0f0;--ac:#111;--at:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d0d;--sf:#171717;--tx:#f2f2f2;--mu:#8a8a8a;--ln:#2a2a2a;--sh:#222;--ac:#f2f2f2;--at:#111;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0d0d;--sf:#171717;--tx:#f2f2f2;--mu:#8a8a8a;--ln:#2a2a2a;--sh:#222;--ac:#f2f2f2;--at:#111;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
[hidden]{display:none!important}
.app{max-width:620px;margin:0 auto;padding:18px 16px 72px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.top b{font-size:17px;letter-spacing:-.01em}
.tabs{display:flex;background:var(--sh);border-radius:10px;padding:3px}
.tabs button{padding:6px 11px;border-radius:8px;color:var(--mu);font-size:14px}
.tabs .on{background:var(--sf);color:var(--tx);box-shadow:0 0 0 1px var(--ln)}
.dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.dt{text-align:center}
.dt h1{font-size:22px;font-weight:650;letter-spacing:-.02em}
.dt p{color:var(--mu);font-size:14px}
.bg{margin-left:8px;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--ac);color:var(--at)}
.ib{width:40px;height:40px;border-radius:10px;font-size:22px;color:var(--mu);display:inline-flex;align-items:center;justify-content:center;flex:none}
.ib:hover{background:var(--sh)}
.ib.sm{width:32px;height:32px;font-size:15px}
.acts{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.acts.end{justify-content:flex-end;margin:14px 0 0}
.btn{border:1px solid var(--ln);background:var(--sf);border-radius:10px;padding:8px 14px;font-size:14px}
.btn:hover{border-color:var(--mu)}
.btn.pri{background:var(--ac);color:var(--at);border-color:var(--ac)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.pgs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:26px}
.pg{border:1px solid var(--ln);background:var(--sf);border-radius:12px;padding:12px 14px}
.pl{display:flex;justify-content:space-between;font-size:14px;color:var(--mu)}
.pl b{color:var(--tx);font-size:18px}
.bar{height:4px;background:var(--sh);border-radius:4px;margin:8px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac)}
.pg small{color:var(--mu);font-size:12px}
section{margin-bottom:30px}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:8px}
h2{font-size:16px;font-weight:650}
ul{list-style:none;padding:0}
.row{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--ln);width:100%;text-align:left}
.ic{width:40px;height:40px;font-size:23px;border-radius:10px;flex:none}
.ic:hover{background:var(--sh)}
.tx{flex:1;min-width:0;display:flex;flex-direction:column;word-break:break-word}
.tx small{color:var(--mu);font-size:13px;font-variant-numeric:tabular-nums}
.done .tx{color:var(--mu);text-decoration:line-through}
.em{color:var(--mu);padding:14px 0;font-size:14px}
.add{display:flex;gap:8px;margin-top:10px}
.add input,.fr input{flex:1;min-width:0;border:1px solid var(--ln);background:var(--sf);border-radius:10px;padding:9px 12px;outline:0}
.add input:focus,.fr input:focus{border-color:var(--mu)}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wd{color:var(--mu);font-size:13px;padding:6px 0}
.cd{aspect-ratio:1;border-radius:12px;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:1px solid transparent}
.cd:hover{background:var(--sh)}
.cd.o{color:var(--mu);opacity:.5}
.cd.td{background:var(--ac);color:var(--at)}
.cd.sel{border-color:var(--mu)}
.cd i{width:4px;height:4px;border-radius:50%;background:currentColor;visibility:hidden}
.cd i.dot{visibility:visible}
.hint{color:var(--mu);font-size:13px;margin:12px 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--sf);width:100%;max-width:460px;border-radius:18px 18px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:94%;overflow:auto;border:1px solid var(--ln)}
@media (min-width:640px){.ov{align-items:center}.sheet{border-radius:18px}}
.sht{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sht h3{font-size:17px}
.fr{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.ic.big{border:1px solid var(--ln);width:44px;height:44px}
.eg{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;margin-bottom:8px}
.eg button{font-size:22px;height:40px;border-radius:8px}
.eg button:hover{background:var(--sh)}
.chs{display:flex;gap:8px;margin:10px 0 0}
.chip{flex:1;border:1px solid var(--ln);border-radius:10px;padding:6px 10px;text-align:left;font-variant-numeric:tabular-nums}
.chip small{display:block;color:var(--mu);font-size:12px}
.chip.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.whs{display:flex;position:relative;height:200px;margin:10px 0}
.whs::before{content:"";position:absolute;left:0;right:0;top:80px;height:40px;background:var(--sh);border-radius:10px}
.wh{flex:1;position:relative;height:200px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;text-align:center;touch-action:pan-y;overscroll-behavior:contain;cursor:grab;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);user-select:none}
.wh::-webkit-scrollbar{display:none}
.pad{height:80px}
.it{height:40px;line-height:40px;scroll-snap-align:center;font-size:20px;color:var(--mu);font-variant-numeric:tabular-nums}
.it.on{color:var(--tx);font-weight:650}
.er{color:var(--tx);font-size:13px;min-height:20px;margin-top:6px;font-weight:600}
.cl .row{padding:12px 4px;justify-content:space-between}
.cl .row:hover{background:var(--sh)}
.ts{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ac);color:var(--at);padding:9px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:90%}
.st{color:var(--mu);font-size:12px;min-width:52px}
.dg{width:28px;height:36px;color:var(--mu);cursor:grab;touch-action:none;flex:none}
.ri-row{flex-wrap:nowrap}
.ri-row input,.ri-row select{border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:8px;padding:6px 8px;outline:0;min-width:0;font:inherit}
.ri-row input[data-f=n]{flex:1}
.nm{width:58px}
.ri-row .ic{width:34px;height:34px;font-size:20px}
textarea{width:100%;min-height:96px;resize:vertical;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:10px;padding:10px 12px;font:inherit;outline:0}
@media (max-width:420px){.pgs{gap:8px}.dt h1{font-size:19px}.eg{grid-template-columns:repeat(7,1fr)}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><b>플래너</b><span class="st" id="st"></span><div class="tabs" id="tabs"></div></div>
  <main id="day"></main>
  <main id="cal" hidden></main>
</div>
<div class="ov" id="ov" hidden><div class="sheet" id="bd"></div></div>
<div class="ts" id="ts" hidden></div>
<script>
const K='planner.v1',H=40,DAYS='일월화수목금토',$=s=>document.querySelector(s);
const EM='📚 💻 ✍️ 📖 🧹 🍳 🍽️ ☕ 🛒 🚿 🪥 💊 🏃 🏋️ 🚴 🧘 🛏️ 😴 📞 ✉️ 💼 📝 🎧 🎮 🎬 🎵 🧺 🐶 🌿 🚗 🚌 🛍️ 💰 🎯 💡 🔧 🏠 🎂 ✈️ 🩺 🍎 🥗 💧 🎨 📷 🧠 ❤️ ⭐ 🔥'.split(' ');
const MK='planner.meta.v1';
let db={};try{db=JSON.parse(localStorage.getItem(K))||{}}catch(e){try{localStorage.setItem('planner.corrupt',localStorage.getItem(K))}catch(x){}}
try{if(!localStorage.getItem('planner.bak0')&&localStorage.getItem(K))localStorage.setItem('planner.bak0',localStorage.getItem(K))}catch(e){}
let meta={fav:[],rt:[],memo:{},U:[],R:[]};
try{const m=JSON.parse(localStorage.getItem(MK));if(m&&typeof m=='object')meta={...meta,...m}}catch(e){}
['fav','rt','U','R'].forEach(k=>{if(!Array.isArray(meta[k]))meta[k]=[]});if(!meta.memo||typeof meta.memo!='object')meta.memo={};
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tf=m=>{const h=Math.floor(m/60);return(h<12?'AM':'PM')+' '+((h%12)||12)+':'+pad(m%60)};
const ico=i=>i.d?'✅':(i.e||'☑️');
const get=k=>db[k]||{t:[],p:[]};
const mut=k=>{snap(k);return db[k]||(db[k]={t:[],p:[]})};
let cur=key(new Date()),view='day',cal={y:0,m:0},M=null,tt;
function stat(t){const e=$('#st');if(e)e.textContent=t}
function save(){for(const k in db)if(!db[k].t.length&&!db[k].p.length)delete db[k];mark();stat('저장 중…');try{localStorage.setItem(K,JSON.stringify(db));localStorage.setItem(MK,JSON.stringify(meta));setTimeout(()=>{stat(CL?'동기화 중…':'기기에 저장됨');cloudQ()},250)}catch(e){stat('저장 실패');toast('저장하지 못했습니다. 브라우저 저장 공간을 확인하세요.')}}
function toast(m){const t=$('#ts');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}
function pr(a){const c=a.filter(i=>i.d).length;return{c,n:a.length,p:a.length?Math.round(c/a.length*100):0}}
const bar=(l,a)=>{const r=pr(a);return`<div class="pg"><div class="pl"><span>${l}</span><b>${r.p}%</b></div><div class="bar"><i style="width:${r.p}%"></i></div><small>${r.c}/${r.n} 완료</small></div>`};
const row=(k,i,sub)=>`<li class="row${i.d?' done':''}"><button class="ic" data-a="tg" data-k="${k}" data-id="${i.id}" aria-label="완료 전환">${ico(i)}</button><div class="tx"><span>${esc(i.n)}</span>${sub?`<small>${sub}</small>`:''}</div>${k=='p'?`<button class="ib sm" data-a="fv" data-id="${i.id}" aria-label="즐겨찾기">${meta.fav.some(f=>f.n==i.n&&(f.e||'')==(i.e||''))?'⭐':'☆'}</button>`:''}<button class="ib sm" data-a="ed" data-k="${k}" data-id="${i.id}" aria-label="수정">✎</button><button class="ib sm" data-a="rm" data-k="${k}" data-id="${i.id}" aria-label="삭제">✕</button></li>`;

function render(){
  $('#tabs').innerHTML=[['day','일정'],['week','주간'],['cal','캘린더'],['more','관리']].map(([v,l])=>`<button data-a="v" data-v="${v}" class="${view==v?'on':''}">${l}</button>`).join('');
  $('#day').hidden=view!='day';$('#cal').hidden=view=='day';
  ({day:rDay,cal:rCal,week:rWeek,more:rMore})[view]();
}
function rDay(){
  const d=parse(cur),T=key(new Date()),x=get(cur),ps=[...x.p].sort((a,b)=>a.s-b.s||a.f-b.f);
  const old=$('#nt')?$('#nt').value:'';
  $('#day').innerHTML=`
<div class="dh"><button class="ib" data-a="step" data-n="-1" aria-label="이전 날">‹</button><div class="dt"><h1>${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일</h1><p>${DAYS[d.getDay()]}요일${cur==T?'<span class="bg">오늘</span>':''}</p></div><button class="ib" data-a="step" data-n="1" aria-label="다음 날">›</button></div>
<div class="acts">${cur!=T?'<button class="btn" data-a="today">오늘로 이동</button>':''}<button class="btn" data-a="copy">다른 날짜에서 복사</button><button class="btn" data-a="undo" ${meta.U.length?'':'disabled'}>↶ 뒤로가기</button><button class="btn" data-a="redo" ${meta.R.length?'':'disabled'}>↷ 다시하기</button></div>
<div class="pgs">${bar('체크리스트',x.t)}${bar('하루 계획',x.p)}</div>
<section><div class="sh"><h2>체크리스트</h2></div><ul>${x.t.map(i=>row('t',i,'')).join('')||'<li class="em">할 일을 추가해 보세요.</li>'}</ul>
<div class="add"><input id="nt" placeholder="새 할 일" maxlength="80" autocomplete="off"><button class="btn pri" data-a="addt">추가</button></div></section>
<section><div class="sh"><h2>하루 계획표</h2><div class="acts" style="margin:0"><button class="btn" data-a="pf">⭐ 즐겨찾기</button><button class="btn" data-a="pr">🔁 루틴</button><button class="btn pri" data-a="addp">＋ 추가</button></div></div><ul>${ps.map(i=>row('p',i,tf(i.s)+' ~ '+tf(i.f))).join('')||'<li class="em">시간별 계획을 추가해 보세요.</li>'}</ul></section>
<section><div class="sh"><h2>하루 메모</h2><button class="btn" data-a="mc">지우기</button></div><textarea id="mm" placeholder="메모를 남겨 보세요. 자동으로 저장됩니다." maxlength="5000">${esc(meta.memo[cur]||'')}</textarea></section>`;
  $('#nt').value=old;
}
function rCal(){
  const T=key(new Date()),st=new Date(cal.y,cal.m,1).getDay();
  let h=`<div class="dh"><button class="ib" data-a="cm" data-n="-1" aria-label="이전 달">‹</button><div class="dt"><h1>${cal.y}년 ${cal.m+1}월</h1></div><button class="ib" data-a="cm" data-n="1" aria-label="다음 달">›</button></div><div class="acts"><button class="btn" data-a="ctoday">이번 달</button></div><div class="cg">`+[...DAYS].map(w=>`<span class="wd">${w}</span>`).join('');
  for(let i=0;i<42;i++){const d=new Date(cal.y,cal.m,1-st+i),k=key(d),x=db[k],has=x&&(x.t.length||x.p.length);
    h+=`<button class="cd${d.getMonth()!=cal.m?' o':''}${k==T?' td':''}${k==cur?' sel':''}" data-a="pick" data-d="${k}">${d.getDate()}<i class="${has?'dot':''}"></i></button>`}
  $('#cal').innerHTML=h+'</div><p class="hint">날짜를 누르면 그 날의 체크리스트와 하루 계획표로 이동합니다. 점은 기록이 있는 날입니다.</p>';
}
function showM(){$('#ov').hidden=false}
function closeM(){$('#ov').hidden=true;M=null;R=null}
const col=(w,a)=>`<div class="wh" data-w="${w}"><div class="pad"></div>${a.map(t=>`<div class="it">${t}</div>`).join('')}<div class="pad"></div></div>`;
function openM(k,id,pre){
  const x=get(cur),it=id&&(k=='f'?meta.fav:k=='t'?x.t:x.p).find(i=>i.id==id),isP=k=='p';
  let s=0,f=0;
  if(isP){if(it){s=it.s;f=it.f}else{const last=x.p.length?Math.max(...x.p.map(i=>i.f)):420;s=Math.min(last,1438);f=Math.min(s+30,1439)}}
  M={k,id:it?it.id:'',n:it?it.n:pre?pre.n:'',e:it?it.e||'':pre?pre.e||'':'',s,f,act:'s'};
  $('#bd').innerHTML=`<div class="sht"><h3>${isP?'계획':k=='f'?'즐겨찾기':'할 일'} ${it?'수정':'추가'}</h3><button class="ib" data-a="x" aria-label="닫기">✕</button></div>
<div class="fr"><button class="ic big" id="me" data-a="ep" aria-label="아이콘 선택"></button><input id="mn" value="${esc(M.n)}" placeholder="${isP?'계획 이름 (예: 양치하기)':'할 일'}" maxlength="80" autocomplete="off"></div>
<div id="eg" hidden><div class="eg">${EM.map(e=>`<button data-a="pe" data-e="${e}">${e}</button>`).join('')}</div><div class="fr"><input id="ce" placeholder="이모지 직접 입력" autocomplete="off"><button class="btn" data-a="pe" data-e="">기본 ☑️</button></div></div>
<p class="hint" style="margin:0 0 4px">아이콘을 정하지 않으면 ☑️, 완료하면 항상 ✅로 표시됩니다.</p>
${isP?`<div class="chs" id="chs"></div><div class="whs">${col('ap',['AM','PM'])}${col('h',Array.from({length:12},(_,i)=>i+1))}${col('m',Array.from({length:60},(_,i)=>pad(i)))}</div>`:''}
<p class="er" id="er"></p><div class="acts end"><button class="btn" data-a="x">취소</button><button class="btn pri" data-a="sv">저장</button></div>`;
  showM();sync();if(isP)requestAnimationFrame(pos);else if(!it)$('#mn').focus();
}
function chk(){
  if(!M||M.k!='p')return'';
  if(M.rt){if(M.s+M.rt.tot>1439)return'루틴이 자정을 넘어 추가할 수 없습니다.';for(const p of rtPlans()){const o=get(cur).p.find(i=>p.s<i.f&&p.f>i.s);if(o)return`“${p.n}” (${tf(p.s)} ~ ${tf(p.f)})가 “${o.n}” (${tf(o.s)} ~ ${tf(o.f)})와 겹칩니다.`}return''}
  if(M.f<=M.s)return'종료 시간은 시작 시간보다 늦어야 합니다.';
  const o=get(cur).p.find(i=>i.id!=M.id&&M.s<i.f&&M.f>i.s);
  return o?`“${o.n}” (${tf(o.s)} ~ ${tf(o.f)})와 시간이 겹칩니다.`:'';
}
function sync(){
  if(!M)return;if($('#me'))$('#me').textContent=M.e||'☑️';
  if(M.k!='p')return;
  $('#chs').innerHTML=[['s','시작',M.s],['f',M.rt?'종료(자동)':'종료',M.rt?Math.min(M.s+M.rt.tot,1439):M.f]].map(([w,l,v])=>`<button class="chip${M.act==w?' on':''}" data-a="ch" data-w="${w}"><small>${l}</small>${tf(v)}</button>`).join('');
  const e=chk();$('#er').textContent=e;$('[data-a=sv]').disabled=!!e;
  if(M.rt&&$('#pv'))$('#pv').innerHTML=rtPlans().map(p=>`<li class="row"><span class="ic" style="display:inline-flex;align-items:center;justify-content:center">${p.e||'☑️'}</span><div class="tx"><span>${esc(p.n)}</span><small>${tf(p.s)} ~ ${tf(p.f)}</small></div></li>`).join('');
}
function hl(el){const i=Math.round(el.scrollTop/H);[...el.querySelectorAll('.it')].forEach((n,j)=>n.classList.toggle('on',j==i))}
function pos(){
  if(!M)return;const v=M[M.act],h=Math.floor(v/60);
  [['ap',h>=12?1:0],['h',((h%12)||12)-1],['m',v%60]].forEach(([w,i])=>{const el=$(`.wh[data-w=${w}]`);el.scrollTop=i*H;hl(el)});
}

  }catch(e){toast('복원하지 못했습니다. 올바른 백업 파일인지 확인하세요. 기존 데이터는 그대로입니다.')}};
  r.readAsText(f);

async function pull(first){
  if(!CL||bz)return;bz=true;
  try{
    const sn=await CL.limit(1000).get();let ch=0;
    const uni=(a,b)=>[...new Map([...a,...b].filter(x=>x&&x.id).map(x=>[x.id,x])).values()];
    sn.docs.forEach(x=>{
      if(!x.exists)return;const v=x.data(),id=x.id;
      if(id=='meta'){const L=meta.ts._m||0;

        else if(msig()==ml&&(v.u||0)>L){meta.fav=v.fav||[];meta.rt=v.rt||[];meta.ts._m=v.u;ml=pm=msig();ch++}
        return}
      if(id.slice(0,2)!='d_'||!Array.isArray(v.t)||!Array.isArray(v.p))return;
      const k=id.slice(2),L=meta.ts[k]||0,has=(db[k]&&(db[k].t.length||db[k].p.length))||meta.memo[k];
      const take=first?(!has||(v.u||0)>=L):(dsig(k)==last[k]&&(v.u||0)>L);

    });

}

}
