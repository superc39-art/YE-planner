<style>
:root{--bg:#fafafa;--sf:#fff;--tx:#111;--mu:#777;--ln:#e6e6e6;--sh:#f0f0f0;--ac:#111;--at:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d0d;--sf:#171717;--tx:#f2f2f2;--mu:#8a8a8a;--ln:#2a2a2a;--sh:#222;--ac:#f2f2f2;--at:#111;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0d0d;--sf:#171717;--tx:#f2f2f2;--mu:#8a8a8a;--ln:#2a2a2a;--sh:#222;--ac:#f2f2f2;--at:#111;color-scheme:dark}
:root{--pr:#3182f6;--on:#fff;--dn:#e5484d;--prs:#eaf2fe;--prs:color-mix(in srgb,var(--pr) 13%,var(--bg))}
.seg{display:flex;background:var(--sh);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;padding:8px 6px;border-radius:8px;color:var(--mu);font-size:14px}
.seg .on{background:var(--sf);color:var(--tx);font-weight:650;box-shadow:0 0 0 1px var(--ln)}
.sws{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.swc{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--mu);width:52px}
.swc i{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:18px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.swc.on{color:var(--tx);font-weight:650}
.swc.on i{box-shadow:0 0 0 2px var(--bg),0 0 0 4px currentColor}
.tpv{display:flex;align-items:center;gap:10px;margin-top:14px;padding:12px 14px;border:1px solid var(--ln);border-radius:12px;background:var(--sf)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
:root{--bgi:none;--bgs:cover;--cbg:var(--sf);--sbg:var(--cbg);--bc:var(--ln);--bw:1px;--r:16px;--rs:10px;--rb:10px;--shd:none;--shb:none;--shi:none;--blur:none;--ib:var(--sf);--pbg:var(--pr);--font:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;--hf:var(--font);--tbb:var(--sf);--fr:50%;--fbw:0px;--shf:0 6px 18px rgba(0,0,0,.22);--rowbg:var(--bg);--rc:var(--pr);--rt:var(--sh);--tbon:var(--pr)}
[hidden]{display:none!important}
.app{max-width:620px;margin:0 auto;padding:14px 16px calc(150px + env(safe-area-inset-bottom,0px))}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.top b{font-size:17px;letter-spacing:-.01em}
.tabs{display:flex;background:var(--sh);border-radius:10px;padding:3px}
.tabs button{padding:6px 11px;border-radius:8px;color:var(--mu);font-size:14px}
.tabs .on{background:var(--sf);color:var(--tx);box-shadow:0 0 0 1px var(--ln)}
.dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.dt{text-align:center}

<script>
const K='planner.v1',H=40,DAYS='일월화수목금토',$=s=>document.querySelector(s);
const EM='📚 💻 ✍️ 📖 🧹 🍳 🍽️ ☕ 🛒 🚿 🪥 💊 🏃 🏋️ 🚴 🧘 🛏️ 😴 📞 ✉️ 💼 📝 🎧 🎮 🎬 🎵 🧺 🐶 🌿 🚗 🚌 🛍️ 💰 🎯 💡 🔧 🏠 🎂 ✈️ 🩺 🍎 🥗 💧 🎨 📷 🧠 ❤️ ⭐ 🔥'.split(' ');
const MK='planner.meta.v1';
let db={};try{db=JSON.parse(localStorage.getItem(K))||{}}catch(e){try{localStorage.setItem('planner.corrupt',localStorage.getItem(K))}catch(x){}}
try{if(!localStorage.getItem('planner.bak0')&&localStorage.getItem(K))localStorage.setItem('planner.bak0',localStorage.getItem(K))}catch(e){}
let meta={fav:[],rt:[],memo:{},U:[],R:[]};
try{const m=JSON.parse(localStorage.getItem(MK));if(m&&typeof m=='object')meta={...meta,...m}}catch(e){}
['fav','rt','U','R'].forEach(k=>{if(!Array.isArray(meta[k]))meta[k]=[]});if(!meta.memo||typeof meta.memo!='object')meta.memo={};
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tf=m=>{const h=Math.floor(m/60);return(h<12?'AM':'PM')+' '+((h%12)||12)+':'+pad(m%60)};
const ico=i=>i.d?'✅':(i.e||'☑️');
const get=k=>db[k]||{t:[],p:[]};
const mut=k=>{snap(k);return db[k]||(db[k]={t:[],p:[]})};
let cur=key(new Date()),view='day',cal={y:0,m:0},M=null,tt;
function stat(t){const e=$('#st');if(e)e.textContent=t}
function save(){for(const k in db)if(!db[k].t.length&&!db[k].p.length)delete db[k];try{localStorage.setItem(K,JSON.stringify(db));localStorage.setItem(MK,JSON.stringify(meta))}catch(e){toast('저장하지 못했어요. 아이폰 저장 공간을 확인하세요.')}}
let TA=null,jd=null,sup=0,G=null;
function toast(m,act){const t=$('#ts');t.hidden=true;t.innerHTML=`<span>${esc(m)}</span>${act?`<button id="tsa">${esc(act.l)}</button>`:''}`;TA=act?act.f:null;void t.offsetWidth;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{t.hidden=true;TA=null},act?4500:2600)}
function pr(a){const c=a.filter(i=>i.d).length;return{c,n:a.length,p:a.length?Math.round(c/a.length*100):0}}
const bar=(l,a)=>{const r=pr(a);return`<div class="pg"><div class="pl"><span>${l}</span><b>${r.p}%</b></div><div class="bar"><i style="width:${r.p}%"></i></div><small>${r.c}/${r.n} 완료</small></div>`};
const isFav=i=>meta.fav.some(f=>f.n==i.n&&(f.e||'')==(i.e||''));
const row=(k,i,sub)=>`<li class="sw"><div class="del" aria-hidden="true">삭제</div><div class="row${i.d?' done':''}${i.id==jd?' pop':''}" data-k="${k}" data-id="${i.id}"><button class="ic" data-a="tg" data-k="${k}" data-id="${i.id}" aria-label="완료 전환">${ico(i)}</button><button class="tx" data-a="ed" data-k="${k}" data-id="${i.id}"><span>${esc(i.n)}</span>${sub?`<small>${sub}</small>`:''}</button>${k=='p'&&isFav(i)?'<span class="fvm" aria-label="즐겨찾기">⭐</span>':''}</div></li>`;
const SV=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const TABS=[['day','일정',SV('<path d="M10 6h10M10 12h10M10 18h10"/><path d="M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5 2.5-2.5M3.5 18l1.5 1.5 2.5-2.5"/>')],['week','주간',SV('<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 13v4M12 13v4M16 13v4"/>')],['cal','캘린더',SV('<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2.5v3M16 2.5v3"/><circle cx="12" cy="15" r="1.3" fill="currentColor"/>')],['more','관리',SV('<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>')]];
function dayOk(k){const x=db[k];if(!x)return false;const a=[...x.t,...x.p];return a.length>0&&a.every(i=>i.d)}
function streak(){const d=new Date();if(!dayOk(key(d)))d.setDate(d.getDate()-1);let n=0;while(dayOk(key(d))&&n<3660){n++;d.setDate(d.getDate()-1)}return n}
function hero(x){
  const a=[...x.t,...x.p],r=pr(a),C=2*Math.PI*28,T=cur==key(new Date()),s=T?streak():0,all=r.n&&r.c==r.n;
  const stk=s>=2?`<span class="stk">🔥 ${s}일 연속 달성${all?'':' 중'}</span>`:'';
  const ring=`<div class="ring"><svg viewBox="0 0 68 68"><circle class="rb" cx="34" cy="34" r="28"/><circle class="rf" cx="34" cy="34" r="28" style="--c:${C}" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-r.p/100)}"/></svg><span>${all?'✓':r.p+'%'}</span></div>`;
  if(!r.n)return`<div class="hero">${ring}<div><b>오늘의 진행률</b><small>할 일이나 계획을 추가하면 여기서 진행률을 볼 수 있어요.</small>${stk}</div></div>`;
  return`<div class="hero${all?' done':''}">${ring}<div><b>${all?(T?'오늘':'이 날')+' 할 일을 다 했어요 🎉':'오늘의 진행률'}</b><small>체크리스트 ${pr(x.t).c}/${x.t.length} · 계획 ${pr(x.p).c}/${x.p.length}</small>${stk}</div></div>`;
}
const empty=(ic,t,s,a,l)=>`<li class="es"><div class="esi">${ic}</div><b>${t}</b><small>${s}</small><button class="btn pri" data-a="${a}">${l}</button></li>`;
function tipOn(){try{return!localStorage.getItem('planner.tip')}catch(e){return false}}

function render(){
  $('#tabs').innerHTML=TABS.map(([v,l,ic])=>`<button data-a="v" data-v="${v}" class="${view==v?'on':''}" aria-current="${view==v?'page':'false'}">${ic}<span>${l}</span></button>`).join('');
  $('#fab').hidden=view!='day';
  $('#day').hidden=view!='day';$('#cal').hidden=view=='day';
  ({day:rDay,cal:rCal,week:rWeek,more:rMore})[view]();
}
function rDay(){
  const d=parse(cur),T=key(new Date()),x=get(cur),ps=[...x.p].sort((a,b)=>a.s-b.s||a.f-b.f);
  const old=$('#nt')?$('#nt').value:'';
  $('#day').innerHTML=`
<div class="dh"><button class="ib" data-a="step" data-n="-1" aria-label="이전 날">‹</button><div class="dt"><h1>${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일</h1><p>${DAYS[d.getDay()]}요일${cur==T?'<span class="bg">오늘</span>':''}</p></div><button class="ib" data-a="step" data-n="1" aria-label="다음 날">›</button></div>
${cur!=T?'<div class="acts" style="justify-content:center"><button class="btn" data-a="today">오늘로 이동</button></div>':''}
${hero(x)}
${(x.t.length||x.p.length)&&tipOn()?'<div class="tip">👆 밀면 삭제 · 길게 누르면 메뉴<button data-a="tipok">알겠어요</button></div>':''}
<section><div class="sh"><h2>체크리스트</h2></div><ul>${x.t.map(i=>row('t',i,'')).join('')||empty('📝','아직 할 일이 없어요','오늘 꼭 해야 할 일을 적어 두세요','ft','할 일 쓰기')}</ul>
<div class="add"><input id="nt" placeholder="새 할 일" maxlength="80" autocomplete="off"><button class="btn pri" data-a="addt">추가</button></div></section>
<section><div class="sh"><h2>하루 계획표</h2></div><ul>${ps.map(i=>row('p',i,tf(i.s)+' ~ '+tf(i.f)+alTx(i.a))).join('')||empty('🗓️','시간별 계획이 비어 있어요','즐겨찾기나 루틴으로 한 번에 채울 수도 있어요','fab','계획 추가')}</ul></section>
<section><div class="sh"><h2>하루 메모</h2><button class="btn" data-a="mc">지우기</button></div><textarea id="mm" placeholder="메모를 남겨 보세요. 자동으로 저장됩니다." maxlength="5000">${esc(meta.memo[cur]||'')}</textarea></section>`;
  $('#nt').value=old;
}
function rCal(){
  const T=key(new Date()),st=new Date(cal.y,cal.m,1).getDay();
  let h=`<div class="dh"><button class="ib" data-a="cm" data-n="-1" aria-label="이전 달">‹</button><div class="dt"><h1>${cal.y}년 ${cal.m+1}월</h1></div><button class="ib" data-a="cm" data-n="1" aria-label="다음 달">›</button></div><div class="acts"><button class="btn" data-a="ctoday">이번 달</button></div><div class="cg">`+[...DAYS].map(w=>`<span class="wd">${w}</span>`).join('');
  for(let i=0;i<42;i++){const d=new Date(cal.y,cal.m,1-st+i),k=key(d),x=db[k],has=x&&(x.t.length||x.p.length);

  $('#cal').innerHTML=h+'</div><p class="hint">날짜를 누르면 그 날의 체크리스트와 하루 계획표로 이동합니다. 점은 기록이 있는 날입니다.</p>';
}
function showM(){$('#ov').hidden=false}
function go(n){const d=parse(cur);cur=key(new Date(d.getFullYear(),d.getMonth(),d.getDate()+n));render();const el=view=='day'?$('#day'):$('#cal');try{el.animate([{transform:`translateX(${n>0?36:-36}px)`,opacity:.35},{transform:'none',opacity:1}],{duration:230,easing:'ease-out'})}catch(x){}}
function del(k,id){const x=mut(cur),it=x[k].find(i=>i.id==id);x[k]=x[k].filter(i=>i.id!=id);save();render();toast(`“${it?it.n:''}” 삭제했어요`,{l:'되돌리기',f:()=>rest(meta.U,meta.R)})}
const sheetList=a=>`<ul class="cl">${a.map(([act,ic,t,s,ex])=>`<li><button class="row" data-a="${act}"${ex||''}><span class="ic" style="display:inline-flex;align-items:center;justify-content:center">${ic}</span><span class="tx"><span>${t}</span>${s?`<small>${s}</small>`:''}</span></button></li>`).join('')}</ul>`;
function openAdd(){M=null;R=null;$('#bd').innerHTML=`<div class="sht"><h3>추가하기</h3><button class="ib" data-a="x" aria-label="닫기">✕</button></div>`+sheetList([['addp','＋','새 계획','시간을 정해서 직접 만들기'],['pf','⭐','즐겨찾기에서','자주 하는 계획 불러오기'],['pr','🔁','루틴에서','여러 계획을 한 번에 넣기'],['copy','📋','다른 날짜에서 복사','체크리스트와 계획 모두']]);showM()}
function openAct(k,id){const x=get(cur),i=(k=='t'?x.t:x.p).find(z=>z.id==id);if(!i)return;M=null;R=null;const q=` data-k="${k}" data-id="${id}"`;
  $('#bd').innerHTML=`<div class="sht"><h3>${esc(((i.e||'')+' '+i.n).trim())}</h3><button class="ib" data-a="x" aria-label="닫기">✕</button></div>`+sheetList([['ed','✎','수정','',q],...(k=='p'?[['fv',isFav(i)?'☆':'⭐',isFav(i)?'즐겨찾기 해제':'즐겨찾기에 추가','',q]]:[]),['rm','🗑','<span style="color:var(--dn)">삭제</span>','되돌리기로 복구할 수 있어요',q]]);showM()}
document.addEventListener('pointerdown',e=>{
  if(view!='day'||!$('#ov').hidden||!e.target.closest)return;
  if(!e.target.closest('#day')||e.target.closest('input,textarea,select'))return;
  const r=e.target.closest('.sw .row');
  G={x:e.clientX,y:e.clientY,r,dx:0,ax:null,id:e.pointerId,lp:r?setTimeout(()=>{if(G&&!G.ax){const k=r.dataset.k,id=r.dataset.id;G=null;sup=1;setTimeout(()=>sup=0,700);openAct(k,id)}},500):0};
});
document.addEventListener('pointermove',e=>{
  if(!G||e.pointerId!=G.id)return;const dx=e.clientX-G.x,dy=e.clientY-G.y;
  if(!G.ax){if(Math.hypot(dx,dy)<9)return;clearTimeout(G.lp);G.ax=Math.abs(dx)>Math.abs(dy)*1.2?'x':'y';if(G.ax=='y'){G=null;return}}
  G.dx=dx;
  if(G.r){G.r.parentNode.classList.add('swp');G.r.style.transition='none';G.r.style.transform=`translateX(${Math.min(0,dx)}px)`}
  else{const d=$('#day');d.style.transition='none';d.style.transform=`translateX(${dx*.35}px)`}
});
function gEnd(e,cancel){
  if(!G||(e&&e.pointerId!=G.id))return;clearTimeout(G.lp);const g=G;G=null;if(g.ax!='x')return;
  sup=1;setTimeout(()=>sup=0,350);
  if(g.r){g.r.style.transition='';if(!cancel&&g.dx<-90){g.r.style.transform='translateX(-100%)';const k=g.r.dataset.k,id=g.r.dataset.id;setTimeout(()=>del(k,id),200)}else{g.r.style.transform='';setTimeout(()=>g.r.parentNode&&g.r.parentNode.classList.remove('swp'),240)}}
  else{const d=$('#day');d.style.transition='transform .2s ease-out';d.style.transform='';setTimeout(()=>d.style.transition='',220);if(!cancel&&Math.abs(g.dx)>70)go(g.dx<0?1:-1)}
}
document.addEventListener('pointerup',e=>gEnd(e,false));
document.addEventListener('pointercancel',e=>gEnd(e,true));
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.createElement('canvas'),x=c.getContext('2d'),q=devicePixelRatio||1,W=c.width=innerWidth*q,Hh=c.height=innerHeight*q;c.className='cf';document.body.appendChild(c);
  const cs=['#3182f6','#f5b70a','#e5484d','#30a46c','#8e4ec6','#7fb2ff'],P=Array.from({length:150},()=>({x:W/2+(Math.random()-.5)*W*.2,y:Hh*.42,vx:(Math.random()-.5)*W*.028,vy:-(Math.random()*.026+.008)*Hh,s:(5+Math.random()*5)*q,c:cs[Math.random()*cs.length|0],r:Math.random()*6,vr:(Math.random()-.5)*.4}));
  let f=0;(function t(){x.clearRect(0,0,W,Hh);P.forEach(p=>{p.vy+=Hh*.0008;p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.globalAlpha=Math.max(0,1-f/120);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++f<120)requestAnimationFrame(t);else c.remove()})();
}
function closeM(){$('#ov').hidden=true;M=null;R=null}
const col=(w,a)=>`<div class="wh" data-w="${w}"><div class="pad"></div>${a.map(t=>`<div class="it">${t}</div>`).join('')}<div class="pad"></div></div>`;
function openM(k,id,pre){
  const x=get(cur),it=id&&(k=='f'?meta.fav:k=='t'?x.t:x.p).find(i=>i.id==id),isP=k=='p';
  let s=0,f=0;
  if(isP){if(it){s=it.s;f=it.f}else{const last=x.p.length?Math.max(...x.p.map(i=>i.f)):420;s=Math.min(last,1438);f=Math.min(s+30,1439)}}
  M={k,id:it?it.id:'',n:it?it.n:pre?pre.n:'',e:it?it.e||'':pre?pre.e||'':'',s,f,act:'s'};
  $('#bd').innerHTML=`<div class="sht"><h3>${isP?'계획':k=='f'?'즐겨찾기':'할 일'} ${it?'수정':'추가'}</h3><button class="ib" data-a="x" aria-label="닫기">✕</button></div>
<div class="fr"><button class="ic big" id="me" data-a="ep" aria-label="아이콘 선택"></button><input id="mn" value="${esc(M.n)}" placeholder="${isP?'계획 이름 (예: 양치하기)':'할 일'}" maxlength="80" autocomplete="off"></div>
<div id="eg" hidden><div class="eg">${EM.map(e=>`<button data-a="pe" data-e="${e}">${e}</button>`).join('')}</div><div class="fr"><input id="ce" placeholder="이모지 직접 입력" autocomplete="off"><button class="btn" data-a="pe" data-e="">기본 ☑️</button></div></div>
<p class="hint" style="margin:0 0 4px">아이콘을 정하지 않으면 ☑️, 완료하면 항상 ✅로 표시됩니다.</p>
${isP?`<div class="chs" id="chs"></div><div class="whs">${col('ap',['AM','PM'])}${col('h',Array.from({length:12},(_,i)=>i+1))}${col('m',Array.from({length:60},(_,i)=>pad(i)))}</div>${alUI(it?it.a!=null:false,it&&it.a!=null?it.a:10)}`:''}
<p class="er" id="er"></p><div class="acts end"><button class="btn" data-a="x">취소</button><button class="btn pri" data-a="sv">저장</button></div>`;
  showM();sync();if(isP)requestAnimationFrame(pos);else if(!it)$('#mn').focus();
}
function chk(){
  if(!M||M.k!='p')return'';
  if(M.rt){if(M.s+M.rt.tot>1439)return'루틴이 자정을 넘어 추가할 수 없습니다.';for(const p of rtPlans()){const o=get(cur).p.find(i=>p.s<i.f&&p.f>i.s);if(o)return`“${p.n}” (${tf(p.s)} ~ ${tf(p.f)})가 “${o.n}” (${tf(o.s)} ~ ${tf(o.f)})와 겹칩니다.`}return''}
  if(M.f<=M.s)return'종료 시간은 시작 시간보다 늦어야 합니다.';
  const o=get(cur).p.find(i=>i.id!=M.id&&M.s<i.f&&M.f>i.s);
  return o?`“${o.n}” (${tf(o.s)} ~ ${tf(o.f)})와 시간이 겹칩니다.`:'';
}
function sync(){
  if(!M)return;if($('#me'))$('#me').textContent=M.e||'☑️';
  if(M.k!='p')return;
  $('#chs').innerHTML=[['s','시작',M.s],['f',M.rt?'종료(자동)':'종료',M.rt?Math.min(M.s+M.rt.tot,1439):M.f]].map(([w,l,v])=>`<button class="chip${M.act==w?' on':''}" data-a="ch" data-w="${w}"><small>${l}</small>${tf(v)}</button>`).join('');
  const e=chk();$('#er').textContent=e;$('[data-a=sv]').disabled=!!e;
  if(M.rt&&$('#pv'))$('#pv').innerHTML=rtPlans().map(p=>`<li class="row"><span class="ic" style="display:inline-flex;align-items:center;justify-content:center">${p.e||'☑️'}</span><div class="tx"><span>${esc(p.n)}</span><small>${tf(p.s)} ~ ${tf(p.f)}</small></div></li>`).join('');
}
function hl(el){const i=Math.round(el.scrollTop/H);[...el.querySelectorAll('.it')].forEach((n,j)=>n.classList.toggle('on',j==i))}
function pos(){
  if(!M)return;const v=M[M.act],h=Math.floor(v/60);
  [['ap',h>=12?1:0],['h',((h%12)||12)-1],['m',v%60]].forEach(([w,i])=>{const el=$(`.wh[data-w=${w}]`);el.scrollTop=i*H;hl(el)});
}
function rd(){const g=c=>Math.round($(`.wh[data-w=${c}]`).scrollTop/H);return(((g('h')+1)%12)+g('ap')*12)*60+g('m')}
document.addEventListener('scroll',e=>{
  const w=e.target;if(!M||M.k!='p'||!w.classList||!w.classList.contains('wh'))return;
  const v=rd();
  if(M.act=='s'){const du=Math.max(M.f-M.s,1);M.s=v;M.f=Math.min(1439,v+du)}else M.f=v;
  hl(w);sync();
},true);
let dr=null;
document.addEventListener('pointerdown',e=>{
  const w=e.target.closest&&e.target.closest('.wh');if(!w||e.pointerType!='mouse')return;
  dr={w,y:e.clientY,t:w.scrollTop,m:0};w.style.scrollSnapType='none';w.setPointerCapture(e.pointerId);e.preventDefault();
});
document.addEventListener('pointermove',e=>{if(!dr)return;const dy=e.clientY-dr.y;dr.m=Math.max(dr.m,Math.abs(dy));dr.w.scrollTop=dr.t-dy});

function rtotal(){$('#rtot').textContent='총 소요 시간 '+dur(R.items.reduce((q,i)=>q+mins(i),0))}
function drawRI(){
  $('#ri').innerHTML=R.items.map(i=>`<li class="row ri-row" data-id="${i.id}"><button class="dg" aria-label="순서 변경">☰</button><button class="ic" data-a="rie" data-id="${i.id}" aria-label="아이콘">${i.e||'☑️'}</button><input data-f="n" value="${esc(i.n)}" placeholder="계획 이름" maxlength="80"><input data-f="v" class="nm" type="number" min="1" step="any" inputmode="decimal" value="${esc(i.v)}" aria-label="소요 시간"><select data-f="u" aria-label="단위"><option value="m"${i.u=='m'?' selected':''}>분</option><option value="h"${i.u=='h'?' selected':''}>시간</option></select><button class="ib sm" data-a="rid" data-id="${i.id}" aria-label="삭제">✕</button></li>`).join('')||'<li class="em">세부 계획을 추가하세요.</li>';
  rtotal();
}
function openR(id){
  const r=id&&meta.rt.find(x=>x.id==id);M=null;
  R={id:r?r.id:'',n:r?r.n:'',ei:null,items:r?r.items.map(i=>({id:uid(),n:i.n,e:i.e||'',u:i.u||'m',v:i.u=='h'?+(i.m/60).toFixed(2):i.m})):[]};
  $('#bd').innerHTML=`<div class="sht"><h3>루틴 ${r?'수정':'만들기'}</h3><button class="ib" data-a="x" aria-label="닫기">✕</button></div>
<div class="fr"><input id="rn" value="${esc(R.n)}" placeholder="루틴 이름 (예: 모닝 루틴)" maxlength="40" autocomplete="off"></div>${egr()}
<ul id="ri"></ul><div class="acts" style="margin:10px 0 0"><button class="btn" data-a="ria">＋ 계획 추가</button></div>
<p class="hint" id="rtot"></p><p class="er" id="er"></p><div class="acts end"><button class="btn" data-a="x">취소</button><button class="btn pri" data-a="rsv">저장</button></div>`;
  showM();drawRI();
}
function openRA(id){
  const r=meta.rt.find(x=>x.id==id);if(!r)return;
  const x=get(cur),tot=r.items.reduce((q,i)=>q+i.m,0),s=Math.min(x.p.length?Math.max(...x.p.map(i=>i.f)):420,1438);R=null;
  M={k:'p',id:'',n:'',e:'',s,f:Math.min(s+tot,1439),act:'s',rt:{n:r.n,items:r.items,tot}};
  $('#bd').innerHTML=`<div class="sht"><h3>🔁 ${esc(r.n)}</h3><button class="ib" data-a="x" aria-label="닫기">✕</button></div><p class="hint" style="margin:0">시작 시간만 정하면 나머지는 자동 계산됩니다. 총 ${dur(tot)}.</p><div class="chs" id="chs"></div><div class="whs">${col('ap',['AM','PM'])}${col('h',Array.from({length:12},(_,i)=>i+1))}${col('m',Array.from({length:60},(_,i)=>pad(i)))}</div>${alUI(false,10)}<ul id="pv"></ul><p class="er" id="er"></p><div class="acts end"><button class="btn" data-a="x">취소</button><button class="btn pri" data-a="sv">이 날짜에 추가</button></div>`;
  showM();sync();requestAnimationFrame(pos);
}
function openPick(f){
  M=null;R=null;const L=f?meta.fav:meta.rt;
  $('#bd').innerHTML=`<div class="sht"><h3>${f?'즐겨찾기':'루틴'}에서 추가</h3><button class="ib" data-a="x" aria-label="닫기">✕</button></div>`+(L.length?`<ul class="cl">${L.map(x=>`<li><button class="row" data-a="${f?'fa':'ra'}" data-id="${x.id}"><span>${f?(x.e||'☑️'):'🔁'} ${esc(x.n)}</span>${f?'':`<small class="hint" style="margin:0">${x.items.length}개, ${dur(x.items.reduce((q,i)=>q+i.m,0))}</small>`}</button></li>`).join('')}</ul>`:`<p class="em">${f?'즐겨찾기가 없어요. 계획을 길게 눌러 등록할 수 있어요.':'루틴이 없습니다. 관리 탭에서 만들 수 있습니다.'}</p>`);
  showM();
}
function okDb(o){return o&&typeof o=='object'&&!Array.isArray(o)&&Object.entries(o).every(([k,v])=>/^\d{4}-\d\d-\d\d$/.test(k)&&v&&Array.isArray(v.t)&&Array.isArray(v.p)&&v.t.every(i=>i&&typeof i.n=='string'&&typeof i.id=='string')&&v.p.every(i=>i&&typeof i.n=='string'&&typeof i.id=='string'&&Number.isFinite(i.s)&&Number.isFinite(i.f)))}
async function exp(){
  const j=JSON.stringify({app:'planner',v:1,at:new Date().toISOString(),db,meta:{fav:meta.fav,rt:meta.rt,memo:meta.memo},theme:(()=>{try{return JSON.parse(localStorage.getItem('planner.theme'))}catch(e){return null}})()},null,1),f='planner-backup-'+key(new Date())+'.json';
  try{const d=window.claude&&await claude.use('downloads');if(d){await d.save({filename:f,data:j});return}}catch(e){if(e&&e.code=='declined')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download=f;a.click();toast('백업 파일을 내보냈습니다.');
}
function imp(f){
  const r=new FileReader();
  r.onload=()=>{try{
    const o=JSON.parse(r.result);if(!o||o.app!='planner'||!okDb(o.db))throw 0;
    const m=o.meta||{},fv=Array.isArray(m.fav)?m.fav.filter(x=>x&&typeof x.n=='string'&&x.id):[],rt=Array.isArray(m.rt)?m.rt.filter(x=>x&&typeof x.n=='string'&&x.id&&Array.isArray(x.items)&&x.items.every(i=>i&&typeof i.n=='string'&&Number.isFinite(i.m))):[];
    const go=()=>{try{
    localStorage.setItem('planner.prev',JSON.stringify({db,meta}));
    db=o.db;meta={fav:fv,rt:rt,memo:m.memo&&typeof m.memo=='object'&&!Array.isArray(m.memo)?m.memo:{},U:[],R:[],ts:{}};save();render();toast('복원했습니다.')}catch(e){toast('복원하지 못했습니다. 저장 공간을 확인하세요.')}};ask('백업 파일로 복원하면 현재 데이터가 덮어써집니다. 계속할까요? 현재 데이터는 이 브라우저에 한 번 자동 보관됩니다.',go,'복원');
  }catch(e){toast('복원하지 못했습니다. 올바른 백업 파일인지 확인하세요. 기존 데이터는 그대로입니다.')}};
  r.readAsText(f);
}
document.addEventListener('change',e=>{if(e.target.id=='fi'&&e.target.files[0]){imp(e.target.files[0]);e.target.value=''}});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id=='mm'){if(t.value)meta.memo[cur]=t.value;else delete meta.memo[cur];stat('저장 중…');clearTimeout(mt);mt=setTimeout(save,400);return}
  if(!R)return;
  if(t.id=='rn'){R.n=t.value;return}
  const r=t.closest&&t.closest('.ri-row'),f=t.dataset&&t.dataset.f,it=r&&R.items.find(i=>i.id==r.dataset.id);
  if(it&&f){it[f]=t.value;rtotal()}
});
document.addEventListener('pointerdown',e=>{const h=e.target.closest&&e.target.closest('.dg');if(!h)return;dg=h.closest('.ri-row');dg.style.opacity='.5';h.setPointerCapture(e.pointerId);e.preventDefault()});
document.addEventListener('pointermove',e=>{
  if(!dg)return;const t=document.elementFromPoint(e.clientX,e.clientY),r=t&&t.closest&&t.closest('.ri-row');
  if(!r||r==dg||r.parentNode!=dg.parentNode)return;
  dg.compareDocumentPosition(r)&4?r.after(dg):r.before(dg);
});
document.addEventListener('pointerup',()=>{
  if(!dg)return;dg.style.opacity='';const ids=[...$('#ri').children].map(x=>x.dataset.id);
  R.items.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id));dg=null;
});
(()=>{const d=new Date();cal={y:d.getFullYear(),m:d.getMonth()};render()})();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}</script>
</body>
